name: Update plugin data

# Regenerates the wiki-sourced datasets bundled with the plugin - drop-rates.json (see
# scripts/generate-drop-rates.py) and collection-log.json (see scripts/generate-collection-log.py,
# formerly named rarity-overrides.json) - and publishes both to the orphan "data" branch, which the
# plugin's RemoteDropRateUpdater and RemoteRarityOverridesUpdater fetch at runtime. This keeps both
# datasets fresh between plugin releases without needing a new Hub version - see
# src/main/java/com/snakesteak/collectionlogpopupenhanced/droprate/RemoteDropRateUpdater.java and
# src/main/java/com/snakesteak/collectionlogpopupenhanced/rarity/RemoteRarityOverridesUpdater.java.
#
# The old rarity-overrides.json already committed on the "data" branch from before this rename is
# deliberately left untouched (not regenerated, not deleted) - it's frozen as-is so plugin builds
# from before the rename that are still fetching that exact old filename/shape keep working.
#
# Scheduled a day after the usual Wednesday OSRS update so the wiki has had time to update its data
# first.
on:
  schedule:
    - cron: '0 6 * * 4'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-plugin-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate drop-rates.json
        run: python scripts/generate-drop-rates.py

      - name: Generate collection-log.json
        run: python scripts/generate-collection-log.py

      - name: Publish to data branch
        env:
          DROP_RATES_FILE: src/main/resources/com/snakesteak/collectionlogpopupenhanced/drop-rates.json
          COLLECTION_LOG_FILE: src/main/resources/com/snakesteak/collectionlogpopupenhanced/collection-log.json
        run: |
          set -e
          cp "$DROP_RATES_FILE" /tmp/drop-rates.json
          cp "$COLLECTION_LOG_FILE" /tmp/collection-log.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The generator scripts just overwrote these tracked files in place. Now that the
          # regenerated content is safely copied out to /tmp, discard that in-place edit -
          # otherwise switching to "data" (a branch whose tree doesn't have these paths at all)
          # fails, since git won't silently drop an uncommitted local change.
          git checkout -- .

          if git fetch origin data; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . > /dev/null
          fi

          cp /tmp/drop-rates.json ./drop-rates.json
          cp /tmp/collection-log.json ./collection-log.json
          git add drop-rates.json collection-log.json

          if git diff --cached --quiet; then
            echo "No changes to plugin data - skipping commit."
          else
            git commit -m "Update plugin data"
            git push origin data
          fi
